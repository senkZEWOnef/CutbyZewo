<!-- AI assistant: floating chat. Talks to /assistant/chat (see assistant.py). -->
<style>
  #asst-fab{position:fixed;right:16px;bottom:16px;z-index:1050;width:56px;height:56px;border-radius:50%;border:0;
    background:linear-gradient(45deg,var(--dark-wood),var(--wood-brown));color:#fff;font-size:1.4rem;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #asst-panel{position:fixed;right:16px;bottom:84px;z-index:1050;width:380px;max-width:calc(100vw - 32px);height:540px;
    max-height:calc(100vh - 110px);background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden}
  #asst-panel.open{display:flex}
  #asst-head{background:linear-gradient(45deg,var(--dark-wood),var(--wood-brown));color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
  #asst-log{flex:1;overflow-y:auto;padding:12px;background:#faf6f0}
  .asst-msg{max-width:88%;margin-bottom:8px;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:.95rem}
  .asst-user{margin-left:auto;background:var(--steel-blue);color:#fff}
  .asst-bot{background:#fff;border:1px solid #e6dccf}
  .asst-act{font-size:.8rem;color:#1e6b34;background:#e6f4ea;border-radius:8px;padding:3px 8px;margin:0 0 6px;display:inline-block}
  #asst-form{display:flex;gap:6px;padding:8px;border-top:1px solid #eee}
  #asst-input{flex:1;resize:none;font-size:16px}
  @media (max-width:576px){ #asst-panel{right:8px;left:8px;width:auto;max-width:none;bottom:80px}}
</style>
<button id="asst-fab" type="button" aria-label="Open assistant" title="Assistant"><i class="fas fa-wand-magic-sparkles"></i></button>
<div id="asst-panel" role="dialog" aria-label="Assistant">
  <div id="asst-head">
    <strong><i class="fas fa-wand-magic-sparkles"></i> Assistant</strong>
    <span><button type="button" id="asst-new" class="btn btn-sm btn-link text-white">New chat</button>
    <button type="button" id="asst-close" class="btn-close btn-close-white" aria-label="Close"></button></span>
  </div>
  <div id="asst-log"></div>
  <form id="asst-form">
    <textarea id="asst-input" class="form-control" rows="1" placeholder="Ask or tell me what to do..."></textarea>
    <button type="button" id="asst-mic" class="btn btn-outline-secondary" style="display:none" aria-label="Dictate"><i class="fas fa-microphone"></i></button>
    <button type="submit" id="asst-send" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const fab=$('asst-fab'), panel=$('asst-panel'), log=$('asst-log'), input=$('asst-input'), send=$('asst-send');
  const csrf = () => document.querySelector('meta[name="csrf-token"]').content;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  let loaded=false, busy=false;

  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  function add(role, text, actions){
    const d=document.createElement('div');
    if(actions && actions.length){
      const a=document.createElement('div');
      a.innerHTML=actions.map(x=>'<span class="asst-act">✓ '+esc(x)+'</span>').join('<br>');
      log.appendChild(a);
    }
    d.className='asst-msg '+(role==='user'?'asst-user':'asst-bot');
    d.innerHTML=fmt(text);
    log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }
  async function load(){
    loaded=true;
    try{
      const r=await fetch('/assistant/history'); const d=await r.json();
      if(d.enabled===false){add('bot','The assistant isn\'t enabled for this account.');return;}
      if(d.configured===false){add('bot','The assistant needs an Anthropic API key set on the server (ANTHROPIC_API_KEY).');}
      if(!d.messages.length){add('bot','Hi! I can look up jobs, read back your schedule, create jobs, move dates, set reminders and answer questions about your account. Try: "What\'s on my schedule this week?"');}
      d.messages.forEach(m=>add(m.role==='user'?'user':'bot',m.text));
    }catch(e){add('bot','Couldn\'t load the assistant.');}
  }
  function toggle(open){
    panel.classList.toggle('open',open);
    if(open){ if(!loaded) load(); setTimeout(()=>input.focus(),50); }
  }
  fab.onclick=()=>toggle(!panel.classList.contains('open'));
  $('asst-close').onclick=()=>toggle(false);
  $('asst-new').onclick=async()=>{
    if(busy) return;
    await fetch('/assistant/reset',{method:'POST',headers:{'X-CSRFToken':csrf()}});
    log.innerHTML=''; loaded=false; load();
  };
  input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('asst-form').requestSubmit();} });
  $('asst-form').onsubmit=async e=>{
    e.preventDefault();
    const text=input.value.trim(); if(!text||busy) return;
    busy=true; send.disabled=true; input.value=''; add('user',text);
    const wait=add('bot','Working…');
    try{
      const r=await fetch('/assistant/chat',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},
        body:JSON.stringify({message:text,tz})});
      const d=await r.json(); wait.remove();
      if(!r.ok) add('bot',d.error||'Something went wrong.');
      else {
        add('bot',d.reply,d.actions);
        // Pages show server-rendered data; refresh after changes so it isn't stale.
        if(d.actions&&d.actions.length) setTimeout(()=>{ try{sessionStorage.setItem('asstOpen','1');}catch(e){} location.reload(); },1800);
      }
    }catch(err){ wait.remove(); add('bot','Network error. Try again.'); }
    busy=false; send.disabled=false; input.focus();
  };
  // Re-open after the post-change reload.
  try{ if(sessionStorage.getItem('asstOpen')){ sessionStorage.removeItem('asstOpen'); toggle(true); } }catch(e){}

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    const mic=$('asst-mic'); mic.style.display='';
    const rec=new SR(); rec.lang=navigator.language||'en-US'; rec.interimResults=false;
    rec.onresult=ev=>{ input.value=(input.value+' '+ev.results[0][0].transcript).trim(); };
    rec.onend=()=>mic.classList.remove('active');
    mic.onclick=()=>{ try{ rec.start(); mic.classList.add('active'); }catch(e){} };
  }
})();
</script>
